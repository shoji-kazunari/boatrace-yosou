# 締切前オッズでの紙上記録を毎日動かす（お金は賭けない）。
#
# GitHub の定時実行（schedule）は数時間遅れたり飛んだりするので、時刻合わせには使わない。
# 代わりに「1回の実行が終わる直前に、次の回を自分で起動する」リレーで24時間つなぐ。
#   - 各回は起動した時刻から約5時間半のあいだに締切5分前を迎えるレースを受け持つ（1回6時間までの制限のため）
#   - その日のレースが残っていない時間帯（夜〜早朝）は、06:30 まで待ってから次を起動する
#   - その日の初回だけ、前日分の答え合わせ・番組表の取得・特徴量づくり・（週1回の）学習をする
# schedule は、リレーが何かの理由で切れたときに再開させるための保険（6時間おき）。
# 準備した特徴量・モデル・公式データはキャッシュで次の回に渡す。記録は records/live/ にコミットする。
name: live

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 同時に動くのは1つだけ。保険の起動が重なっても、待ち行列は1つに畳まれる
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 受け持ちと日付
        id: p
        run: |
          # 締切1分前まで取れるので、4分前から受け持つ（前の回との継ぎ目で取りこぼさない）
          s=$(date -d '-4 min' +%H:%M)
          [ "$(date -d '-4 min' +%Y%m%d)" = "$(date +%Y%m%d)" ] || s=00:00
          e=$(date -d '+325 min' +%H:%M)
          [ "$(date -d '+325 min' +%Y%m%d)" = "$(date +%Y%m%d)" ] || e=24:00
          echo "part=$(date +%H%M)" >> "$GITHUB_OUTPUT"
          echo "start=$s" >> "$GITHUB_OUTPUT"
          echo "end=$e" >> "$GITHUB_OUTPUT"
          echo "day=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "受け持ち $s-$e  $(date)"

      - name: モデルを戻す
        uses: actions/cache/restore@v4
        with:
          path: data/model
          key: model-${{ steps.p.outputs.day }}
          restore-keys: model-

      - name: 当日の準備を戻す
        id: state
        uses: actions/cache/restore@v4
        with:
          path: data/live
          key: state-${{ steps.p.outputs.day }}

      - name: 公式データを戻す
        id: raw
        if: steps.state.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/K
            data/raw/B
          key: raw-${{ steps.p.outputs.day }}
          restore-keys: raw-

      # キャッシュが一度も無いとき（初回・長く止めた後）は、raw-data ブランチの初期コピーから始める。
      # 公式サイトは1ファイル約10秒かかり、3年分を取り直すと1時間を超えるため
      - name: 公式データの初期コピー
        if: steps.state.outputs.cache-hit != 'true' && steps.raw.outputs.cache-matched-key == ''
        run: |
          git fetch -q --depth 1 origin raw-data
          mkdir -p data/raw
          git archive FETCH_HEAD | tar -x -C data/raw
          ls data/raw/K | wc -l

      - name: 公式データの不足分を取得
        if: steps.state.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: python3 tools/download.py 2023-01-01 ${{ steps.p.outputs.yesterday }}

      - name: 当日の準備
        if: steps.state.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: python3 tools/live.py prepare ${{ steps.p.outputs.day }}

      - name: 公式データを保存
        if: steps.state.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/K
            data/raw/B
          key: raw-${{ steps.p.outputs.day }}-${{ github.run_id }}

      - name: 学習（モデルが無いか、7日以上前のとき）
        id: train
        if: steps.state.outputs.cache-hit != 'true'
        run: |
          need=$(python3 - <<'PY'
          import json, pathlib, datetime
          p = pathlib.Path("data/model/config.json")
          if not p.exists():
              print("yes")
          else:
              d = datetime.date.fromisoformat(json.loads(p.read_text())["trained_through"])
              print("yes" if (datetime.date.today() - d).days > 7 else "no")
          PY
          )
          echo "need=$need" >> "$GITHUB_OUTPUT"
          if [ "$need" = yes ]; then python3 tools/live.py train ${{ steps.p.outputs.day }}; fi

      - name: モデルを保存
        if: steps.train.outputs.need == 'yes'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/model
          key: model-${{ steps.p.outputs.day }}-${{ github.run_id }}

      - name: 当日の準備を保存
        if: steps.state.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/live
          key: state-${{ steps.p.outputs.day }}

      - name: 答え合わせ（結果の出ている未照合の日）
        if: steps.state.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 tools/live.py settle ${{ steps.p.outputs.day }}

      - name: 記録
        run: python3 tools/live.py run ${{ steps.p.outputs.day }} ${{ steps.p.outputs.start }} ${{ steps.p.outputs.end }} ${{ steps.p.outputs.part }}

      - name: 記録をコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add records
          git diff --cached --quiet && exit 0
          git commit -m "紙上記録 ${{ steps.p.outputs.day }} ${{ steps.p.outputs.part }}"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: レースの無い時間帯は 06:30 まで待つ
        if: success() || failure()
        run: |
          now=$(date +%s)
          next=$(date -d "today 06:30" +%s)
          [ "$now" -lt "$next" ] || next=$(date -d "tomorrow 06:30" +%s)
          limit=$(( ${{ steps.p.outputs.t0 }} + 325 * 60 ))
          # その日のレースが残っていない（最終の締切を過ぎた・レース一覧が無い）ときだけ待つ。
          # 日中は受け持ちが終わったらすぐ次へ
          left=$(python3 - <<'PY'
          import datetime, pathlib, pandas as pd
          now = datetime.datetime.now()
          f = pathlib.Path(f"data/live/races_{now:%Y%m%d}.csv")
          if now.hour < 6 or not f.exists():
              print(0)
          else:
              dl = pd.read_csv(f).deadline
              last = max(datetime.datetime.combine(now.date(), datetime.time(*map(int, d.split(":")))) for d in dl)
              print(1 if now < last - datetime.timedelta(minutes=1) else 0)
          PY
          )
          if [ "$left" = 0 ]; then
            until=$(( next < limit ? next : limit ))
            if [ "$until" -gt "$now" ]; then
              echo "今日のレースは終了。$(date -d @$until +%H:%M) まで待つ"
              sleep $(( until - now ))
            fi
          fi

      - name: 次の回を起動
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --ref main -R "${{ github.repository }}"

      - name: 取得したページを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ steps.p.outputs.day }}-${{ steps.p.outputs.part }}
          path: data/raw/live/${{ steps.p.outputs.day }}
          if-no-files-found: ignore
          retention-days: 90
